<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="AGRINOVA WEB cover">
  <defs>
    <pattern id="gridMinor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#ffffff" fill-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="800" height="520" fill="#050505"/>
  <rect width="800" height="520" fill="url(#gridMinor)"/>
  <rect width="800" height="520" fill="url(#gridMajor)"/>
  <rect width="800" height="520" fill="url(#scan)"/>

  <!-- ===== motif: abstract field rows (one-point perspective furrows) ===== -->
  <!-- converging furrow lines -->
  <g stroke="#191919" stroke-width="1">
    <line x1="400" y1="80" x2="40" y2="435"/>
    <line x1="400" y1="80" x2="130" y2="435"/>
    <line x1="400" y1="80" x2="220" y2="435"/>
    <line x1="400" y1="80" x2="310" y2="435"/>
    <line x1="400" y1="80" x2="400" y2="435"/>
    <line x1="400" y1="80" x2="490" y2="435"/>
    <line x1="400" y1="80" x2="580" y2="435"/>
    <line x1="400" y1="80" x2="670" y2="435"/>
    <line x1="400" y1="80" x2="760" y2="435"/>
  </g>
  <!-- planting rows -->
  <g stroke="#1c1c1c" stroke-width="1">
    <line x1="40" y1="150" x2="760" y2="150"/>
    <line x1="40" y1="185" x2="760" y2="185"/>
    <line x1="40" y1="225" x2="760" y2="225"/>
    <line x1="40" y1="270" x2="760" y2="270"/>
    <line x1="40" y1="375" x2="760" y2="375"/>
  </g>
  <!-- leaf-node datum row -->
  <line x1="40" y1="320" x2="760" y2="320" stroke="#262626" stroke-width="1"/>
  <!-- ground line -->
  <line x1="40" y1="435" x2="760" y2="435" stroke="#2e2e2e" stroke-width="1"/>

  <!-- leaf-node row -->
  <g fill="#050505" stroke="#4d4d4d" stroke-width="1">
    <rect x="151.6" y="315" width="10" height="10" transform="rotate(45 156.6 320)"/>
    <rect x="214.4" y="315" width="10" height="10" transform="rotate(45 219.4 320)"/>
    <rect x="277.3" y="315" width="10" height="10" transform="rotate(45 282.3 320)"/>
    <rect x="340.2" y="315" width="10" height="10" transform="rotate(45 345.2 320)"/>
    <rect x="449.8" y="315" width="10" height="10" transform="rotate(45 454.8 320)"/>
    <rect x="512.7" y="315" width="10" height="10" transform="rotate(45 517.7 320)"/>
    <rect x="575.6" y="315" width="10" height="10" transform="rotate(45 580.6 320)"/>
    <rect x="638.4" y="315" width="10" height="10" transform="rotate(45 643.4 320)"/>
  </g>

  <!-- circuit plant (red accent) -->
  <line x1="400" y1="435" x2="400" y2="320" stroke="#e8271c" stroke-width="1.5"/>
  <g stroke="#4d4d4d" stroke-width="1" fill="none">
    <path d="M400 370 L368 340"/>
    <path d="M400 370 L432 340"/>
  </g>
  <rect x="364" y="336" width="8" height="8" transform="rotate(45 368 340)" fill="#050505" stroke="#4d4d4d" stroke-width="1"/>
  <rect x="428" y="336" width="8" height="8" transform="rotate(45 432 340)" fill="#050505" stroke="#4d4d4d" stroke-width="1"/>
  <rect x="392" y="312" width="16" height="16" transform="rotate(45 400 320)" fill="#e8271c"/>

  <!-- ===== chrome ===== -->
  <!-- corner brackets -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <path d="M12 30 V12 H30"/>
    <path d="M770 12 H788 V30"/>
    <path d="M12 490 V508 H30"/>
    <path d="M788 490 V508 H770"/>
  </g>

  <!-- top meta -->
  <text x="36" y="32" font-family="monospace" font-size="12" letter-spacing="2" fill="#e8271c">// 005</text>
  <rect x="692" y="18" width="72" height="20" fill="none" stroke="#333333" stroke-width="1"/>
  <text x="728" y="31" font-family="monospace" font-size="9" letter-spacing="1" fill="#6e6e6e" text-anchor="middle">DEPLOYED</text>

  <!-- footer divider -->
  <line x1="36" y1="448" x2="764" y2="448" stroke="#1a1a1a" stroke-width="1"/>

  <!-- title block -->
  <text x="36" y="474" font-family="monospace" font-size="26" letter-spacing="4" font-weight="700" fill="#ffffff">AGRINOVA WEB</text>
  <text x="36" y="496" font-family="monospace" font-size="10" letter-spacing="3" fill="#6e6e6e">WEB / ASTRO SHOWCASE</text>
  <text x="764" y="474" font-family="monospace" font-size="11" letter-spacing="2" fill="#4d4d4d" text-anchor="end">2024</text>
</svg>
