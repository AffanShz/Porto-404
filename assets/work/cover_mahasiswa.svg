<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="MAHASISWA APP cover">
  <defs>
    <pattern id="gridMinor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#ffffff" fill-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="800" height="520" fill="#050505"/>
  <rect width="800" height="520" fill="url(#gridMinor)"/>
  <rect width="800" height="520" fill="url(#gridMajor)"/>
  <rect width="800" height="520" fill="url(#scan)"/>

  <!-- ===== motif: desktop window chrome + file-cabinet rows ===== -->
  <!-- window frame -->
  <rect x="170" y="95" width="460" height="285" fill="#0a0a0a" stroke="#333333" stroke-width="1"/>
  <line x1="170" y1="123" x2="630" y2="123" stroke="#333333" stroke-width="1"/>

  <!-- title bar controls -->
  <g fill="none" stroke="#4d4d4d" stroke-width="1">
    <circle cx="192" cy="109" r="5"/>
    <circle cx="212" cy="109" r="5"/>
    <circle cx="232" cy="109" r="5"/>
  </g>
  <text x="616" y="112" font-family="monospace" font-size="9" letter-spacing="1" fill="#4d4d4d" text-anchor="end">mahasiswa.exe</text>

  <!-- sidebar -->
  <line x1="262" y1="123" x2="262" y2="380" stroke="#2a2a2a" stroke-width="1"/>
  <g fill="#242424">
    <rect x="182" y="142" width="64" height="8"/>
    <rect x="182" y="164" width="56" height="8"/>
    <rect x="182" y="186" width="64" height="8"/>
    <rect x="182" y="208" width="48" height="8"/>
    <rect x="182" y="230" width="60" height="8"/>
  </g>
  <rect x="182" y="356" width="64" height="8" fill="#1a1a1a"/>

  <!-- file-cabinet rows -->
  <g fill="none" stroke="#2a2a2a" stroke-width="1">
    <rect x="278" y="140" width="334" height="24"/>
    <rect x="278" y="174" width="334" height="24"/>
    <rect x="278" y="242" width="334" height="24"/>
    <rect x="278" y="276" width="334" height="24"/>
    <rect x="278" y="310" width="334" height="24"/>
    <rect x="278" y="344" width="334" height="24"/>
  </g>
  <!-- selected row (red accent) -->
  <rect x="278" y="208" width="334" height="24" fill="#e8271c" fill-opacity="0.07"/>
  <rect x="278" y="208" width="334" height="24" fill="none" stroke="#e8271c" stroke-width="1"/>
  <rect x="278" y="208" width="2" height="24" fill="#e8271c"/>

  <!-- row handles -->
  <g fill="none" stroke="#3a3a3a" stroke-width="1">
    <rect x="290" y="147" width="10" height="10"/>
    <rect x="290" y="181" width="10" height="10"/>
    <rect x="290" y="215" width="10" height="10" stroke="#e8271c"/>
    <rect x="290" y="249" width="10" height="10"/>
    <rect x="290" y="283" width="10" height="10"/>
    <rect x="290" y="317" width="10" height="10"/>
    <rect x="290" y="351" width="10" height="10"/>
  </g>

  <!-- row label bars -->
  <g fill="#242424">
    <rect x="312" y="150" width="180" height="4"/>
    <rect x="312" y="184" width="140" height="4"/>
    <rect x="312" y="218" width="200" height="4"/>
    <rect x="312" y="252" width="160" height="4"/>
    <rect x="312" y="286" width="188" height="4"/>
    <rect x="312" y="320" width="130" height="4"/>
    <rect x="312" y="354" width="172" height="4"/>
  </g>
  <!-- row meta bars -->
  <g fill="#1c1c1c">
    <rect x="560" y="150" width="36" height="4"/>
    <rect x="560" y="184" width="36" height="4"/>
    <rect x="560" y="218" width="36" height="4"/>
    <rect x="560" y="252" width="36" height="4"/>
    <rect x="560" y="286" width="36" height="4"/>
    <rect x="560" y="320" width="36" height="4"/>
    <rect x="560" y="354" width="36" height="4"/>
  </g>

  <!-- ===== chrome ===== -->
  <!-- corner brackets -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <path d="M12 30 V12 H30"/>
    <path d="M770 12 H788 V30"/>
    <path d="M12 490 V508 H30"/>
    <path d="M788 490 V508 H770"/>
  </g>

  <!-- top meta -->
  <text x="36" y="32" font-family="monospace" font-size="12" letter-spacing="2" fill="#e8271c">// 004</text>
  <rect x="692" y="18" width="72" height="20" fill="none" stroke="#333333" stroke-width="1"/>
  <text x="728" y="31" font-family="monospace" font-size="9" letter-spacing="1" fill="#6e6e6e" text-anchor="middle">PRODUCTION</text>

  <!-- footer divider -->
  <line x1="36" y1="448" x2="764" y2="448" stroke="#1a1a1a" stroke-width="1"/>

  <!-- title block -->
  <text x="36" y="474" font-family="monospace" font-size="26" letter-spacing="4" font-weight="700" fill="#ffffff">MAHASISWA APP</text>
  <text x="36" y="496" font-family="monospace" font-size="10" letter-spacing="3" fill="#6e6e6e">DESKTOP / TAURI / RUST</text>
  <text x="764" y="474" font-family="monospace" font-size="11" letter-spacing="2" fill="#4d4d4d" text-anchor="end">2025</text>
</svg>
