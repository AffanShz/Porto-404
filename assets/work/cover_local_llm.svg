<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="LOCAL-LLM cover">
  <defs>
    <pattern id="gridMinor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#ffffff" fill-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="800" height="520" fill="#050505"/>
  <rect width="800" height="520" fill="url(#gridMinor)"/>
  <rect width="800" height="520" fill="url(#gridMajor)"/>
  <rect width="800" height="520" fill="url(#scan)"/>

  <!-- ===== motif: neural node graph / inference pipeline ===== -->
  <g stroke="#202020" stroke-width="1">
    <!-- layer 1 -> 2 -->
    <line x1="150" y1="160" x2="310" y2="135"/>
    <line x1="150" y1="160" x2="310" y2="200"/>
    <line x1="150" y1="160" x2="310" y2="265"/>
    <line x1="150" y1="160" x2="310" y2="330"/>
    <line x1="150" y1="230" x2="310" y2="135"/>
    <line x1="150" y1="230" x2="310" y2="265"/>
    <line x1="150" y1="230" x2="310" y2="330"/>
    <line x1="150" y1="300" x2="310" y2="135"/>
    <line x1="150" y1="300" x2="310" y2="200"/>
    <line x1="150" y1="300" x2="310" y2="265"/>
    <line x1="150" y1="300" x2="310" y2="330"/>
    <!-- layer 2 -> 3 -->
    <line x1="310" y1="135" x2="470" y2="200"/>
    <line x1="310" y1="135" x2="470" y2="265"/>
    <line x1="310" y1="135" x2="470" y2="330"/>
    <line x1="310" y1="200" x2="470" y2="135"/>
    <line x1="310" y1="200" x2="470" y2="265"/>
    <line x1="310" y1="200" x2="470" y2="330"/>
    <line x1="310" y1="265" x2="470" y2="135"/>
    <line x1="310" y1="265" x2="470" y2="200"/>
    <line x1="310" y1="265" x2="470" y2="330"/>
    <line x1="310" y1="330" x2="470" y2="135"/>
    <line x1="310" y1="330" x2="470" y2="200"/>
    <line x1="310" y1="330" x2="470" y2="265"/>
    <!-- layer 3 -> 4 -->
    <line x1="470" y1="135" x2="630" y2="200"/>
    <line x1="470" y1="135" x2="630" y2="265"/>
    <line x1="470" y1="200" x2="630" y2="200"/>
    <line x1="470" y1="200" x2="630" y2="265"/>
    <line x1="470" y1="265" x2="630" y2="200"/>
    <line x1="470" y1="265" x2="630" y2="265"/>
    <line x1="470" y1="330" x2="630" y2="200"/>
    <line x1="470" y1="330" x2="630" y2="265"/>
  </g>

  <!-- inference path (red accent) -->
  <g stroke="#e8271c" stroke-width="1.5" fill="none">
    <path d="M150 230 L310 200 L470 200 L630 265"/>
  </g>

  <!-- nodes -->
  <g fill="#0b0b0b" stroke="#4d4d4d" stroke-width="1">
    <circle cx="150" cy="160" r="6"/>
    <circle cx="150" cy="300" r="6"/>
    <circle cx="310" cy="135" r="6"/>
    <circle cx="310" cy="265" r="6"/>
    <circle cx="310" cy="330" r="6"/>
    <circle cx="470" cy="135" r="6"/>
    <circle cx="470" cy="265" r="6"/>
    <circle cx="470" cy="330" r="6"/>
    <circle cx="630" cy="200" r="6"/>
  </g>
  <circle cx="630" cy="265" r="7" fill="#e8271c"/>
  <circle cx="470" cy="200" r="7" fill="#e8271c"/>
  <circle cx="310" cy="200" r="7" fill="#e8271c"/>
  <circle cx="150" cy="230" r="7" fill="#e8271c"/>

  <!-- layer captions -->
  <g font-family="monospace" font-size="9" letter-spacing="2" fill="#3d3d3d" text-anchor="middle">
    <text x="150" y="360">IN</text>
    <text x="310" y="360">ENC</text>
    <text x="470" y="360">DEC</text>
    <text x="630" y="360">OUT</text>
  </g>

  <!-- terminal prompt -->
  <text x="150" y="402" font-family="monospace" font-size="13" letter-spacing="1" fill="#6e6e6e">$ ./infer --device edge --ctx 2048</text>
  <rect x="436" y="391" width="9" height="15" fill="#e8271c"/>
  <text x="150" y="426" font-family="monospace" font-size="11" letter-spacing="1" fill="#3d3d3d">&#187; 38.4 tok/s &#183; egress 0 B &#183; 100% local</text>

  <!-- ===== chrome ===== -->
  <!-- corner brackets -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <path d="M12 30 V12 H30"/>
    <path d="M770 12 H788 V30"/>
    <path d="M12 490 V508 H30"/>
    <path d="M788 490 V508 H770"/>
  </g>

  <!-- top meta -->
  <text x="36" y="32" font-family="monospace" font-size="12" letter-spacing="2" fill="#e8271c">// 003</text>
  <rect x="692" y="18" width="72" height="20" fill="none" stroke="#333333" stroke-width="1"/>
  <text x="728" y="31" font-family="monospace" font-size="9" letter-spacing="2" fill="#6e6e6e" text-anchor="middle">LIVE</text>

  <!-- footer divider -->
  <line x1="36" y1="448" x2="764" y2="448" stroke="#1a1a1a" stroke-width="1"/>

  <!-- title block -->
  <text x="36" y="474" font-family="monospace" font-size="26" letter-spacing="4" font-weight="700" fill="#ffffff">LOCAL-LLM</text>
  <text x="36" y="496" font-family="monospace" font-size="10" letter-spacing="3" fill="#6e6e6e">MOBILE AI / EDGE INFERENCE</text>
  <text x="764" y="474" font-family="monospace" font-size="11" letter-spacing="2" fill="#4d4d4d" text-anchor="end">2025</text>
</svg>
